name: Build & Release Solstride APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses & install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "cmdline-tools;latest" || true
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "platform-tools" "build-tools;36.0.0" || true
          "${SDKMANAGER}" --install "platforms;android-36.1" || "${SDKMANAGER}" --install "platforms;android-36" || true
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore, Firebase config, and environment file
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            (tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore) || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback Android debug keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            echo "Restoring app/google-services.json for com.aistudio.solstride.kxmrvq..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "308720200884",
              "project_id": "gen-lang-client-0756465100",
              "storage_bucket": "gen-lang-client-0756465100.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:308720200884:android:629307e34d242f30803be1",
                  "android_client_info": {
                    "package_name": "com.aistudio.solstride.kxmrvq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "308720200884-o96pq94cbdus1ibqvonma10uk0u1aa85.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.solstride.kxmrvq",
                      "certificate_hash": "171a093227d75bd9ca5493a530654574d977a9ce"
                    }
                  },
                  {
                    "client_id": "308720200884-povn1r9o6m56iongq38b8fvgkvr7nl44.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCfXhj9nJUUXIvXU29LwDUuk2EtWC7jE0A"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "308720200884-povn1r9o6m56iongq38b8fvgkvr7nl44.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-solstrid-53bf7141-bec2-4153-856e-085cbb45e845</string>
          </resources>
          EOF
          fi

      - name: Build Solstride Debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx512m"
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log

      - name: Print Gradle failure summary if build failed
        if: failure()
        shell: bash
        run: |
          echo "### Gradle Build Failure Details" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f gradle-build.log ]; then
            grep -n -C 5 -E "FAILURE:|What went wrong:|OutOfMemoryError|Execution failed for task|e: file://" gradle-build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gradle-build.log not found." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare versioned APK filename
        id: meta
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME="${VERSION_NAME:-25.0}"
          VERSION_CODE="${VERSION_CODE:-25}"
          APK_NAME="Solstride-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solstride-v${{ steps.meta.outputs.version_name }}-apk
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        id: gh_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: Solstride v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          body: |
            Automated Solstride Android APK build (`com.aistudio.solstride.kxmrvq`, version `${{ steps.meta.outputs.version_name }}`, build `${{ steps.meta.outputs.version_code }}`).

            Includes Android Health Connect & Samsung Health compatibility, CapabilityClient + Heartbeat Watch-priority automatic pedometer, and closed-app background step sync.
          files: ${{ steps.meta.outputs.apk_name }}
          make_latest: true

      - name: Summarize APK download status
        shell: bash
        run: |
          echo "### Solstride APK Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK**: \`${{ steps.meta.outputs.apk_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.meta.outputs.version_name }}\` (Build \`${{ steps.meta.outputs.version_code }}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            echo "- **GitHub Release**: Published tag \`v${{ steps.meta.outputs.version_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **GitHub Release**: Skipped (enable **Settings → Actions → General → Workflow permissions → Read and write permissions** to auto-publish Releases). You can still download the APK directly from the **Artifacts** section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
