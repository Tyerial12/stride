name: Build & Release Solstride APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses & install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "cmdline-tools;latest" || true
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "platform-tools" "build-tools;36.0.0" || true
          "${SDKMANAGER}" --install "platforms;android-36.1" || "${SDKMANAGER}" --install "platforms;android-36" || true
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore, Firebase config, and clean environment
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          # 1. Restore debug.keystore from GitHub Secret, repo base64 file, or generate fallback
          if [ -n "${DEBUG_KEYSTORE_BASE64_SECRET}" ] && [ ! -s debug.keystore ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64_SECRET}" | tr -d '\r\n ' | base64 -d > debug.keystore || rm -f debug.keystore
          elif [ -s debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            (tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore) || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback Android debug keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Restore app/google-services.json from GitHub Secret if provided
          if [ -n "${GOOGLE_SERVICES_JSON_SECRET}" ] && [ ! -s app/google-services.json ]; then
            printf '%s\n' "${GOOGLE_SERVICES_JSON_SECRET}" > app/google-services.json
          fi

          # 3. Ensure firebase_applet_config.xml exists
          mkdir -p app/src/main/res/values
          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>' \
              '<resources>' \
              '    <string name="firestore_database_id" translatable="false">ai-studio-android-solstrid-53bf7141-bec2-4153-856e-085cbb45e845</string>' \
              '</resources>' > app/src/main/res/values/firebase_applet_config.xml
          fi

          # 4. Provide non-secret fallback default_web_client_id only if google-services.json does not supply one
          rm -f app/src/main/res/values/ci_auth_fallback.xml
          if [ ! -s app/google-services.json ] || ! grep -q '"client_type"[[:space:]]*:[[:space:]]*3' app/google-services.json; then
            if ! grep -q 'name="default_web_client_id"' app/src/main/res/values/*.xml 2>/dev/null; then
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<resources>' \
                '    <string name="default_web_client_id" translatable="false">missing_google_services_secret</string>' \
                '</resources>' > app/src/main/res/values/ci_auth_fallback.xml
            fi
          fi

          # 5. Truncate .env so no API keys or secrets are compiled into BuildConfig inside the APK
          : > .env

      - name: Build Solstride APK
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx512m"
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log

      - name: Print Gradle failure summary if build failed
        if: failure()
        shell: bash
        run: |
          echo "### Gradle Build Failure Details" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f gradle-build.log ]; then
            grep -n -C 5 -E "FAILURE:|What went wrong:|OutOfMemoryError|Execution failed for task|e: file://" gradle-build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gradle-build.log not found." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package versioned APK files
        id: meta
        shell: bash
        run: |
          set -e
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' | tr -d '\r')
          VERSION_NAME="${VERSION_NAME:-57.0}"
          VERSION_CODE="${VERSION_CODE:-57}"
          APK_NAME="Solstride-v${VERSION_NAME}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Solstride-latest.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solstride-v${{ steps.meta.outputs.version_name }}-apk
          path: |
            ${{ steps.meta.outputs.apk_name }}
            dist/Solstride-latest.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        id: gh_release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: Solstride v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          body: |
            Automated Solstride Android APK build (`com.aistudio.solstride.kxmrvq`, version `${{ steps.meta.outputs.version_name }}`, build `${{ steps.meta.outputs.version_code }}`).

            - **Direct Install APK**: Download `${{ steps.meta.outputs.apk_name }}` below and open it on your Android device.
            - **Features**: Android Health Connect & Samsung Health integration, CapabilityClient + Heartbeat Watch-priority automatic pedometer, and closed-app background step sync.
            - **Security**: Built without embedded `.env` API keys (`ignoreList` configured in `app/build.gradle.kts`).
          files: |
            ${{ steps.meta.outputs.apk_name }}
            dist/Solstride-latest.apk
          make_latest: true

      - name: Summarize APK download status
        shell: bash
        run: |
          echo "### Solstride APK Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK File**: \`${{ steps.meta.outputs.apk_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ steps.meta.outputs.version_name }}\` (Build \`${{ steps.meta.outputs.version_code }}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            echo "- **GitHub Release**: Published tag \`v${{ steps.meta.outputs.version_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Download**: Download the installable APK directly from the **Artifacts** section at the bottom of this workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
